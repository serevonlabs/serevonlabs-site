<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cross-platform software development capabilities</title>
  <desc id="desc">Abstract illustration of web, mobile, enterprise, and Windows software components connected around a business workflow.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.6" stop-color="#0b2b48"/>
      <stop offset="1" stop-color="#0a446f"/>
    </linearGradient>
    <radialGradient id="glow2" cx="58%" cy="20%" r="70%">
      <stop offset="0" stop-color="#2eb4ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2eb4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="42" fill="url(#bg2)"/>
  <rect width="1200" height="760" rx="42" fill="url(#glow2)"/>
  <g fill="none" stroke="#86cffb" stroke-opacity="0.15" stroke-width="3">
    <path d="M-90 150C210 40 338 250 602 157S932 43 1290 150"/>
    <path d="M-80 318C245 220 370 430 650 320S1000 210 1290 324"/>
    <path d="M-70 485C210 390 390 570 675 470S1008 385 1280 488"/>
  </g>

  <text x="70" y="82" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#7fd0ff">FROM BUSINESS NEED TO WORKING SOFTWARE</text>
  <text x="70" y="121" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a9c7d9">A connected development approach across web, mobile, enterprise, and desktop.</text>

  <g filter="url(#shadow2)" font-family="Arial,Helvetica,sans-serif">
    <rect x="405" y="188" width="390" height="218" rx="34" fill="#071725" stroke="#37b7ff" stroke-width="3"/>
    <text x="600" y="246" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="3" fill="#65c7ff">YOUR BUSINESS</text>
    <text x="600" y="294" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Workflow + Requirements</text>
    <text x="600" y="336" text-anchor="middle" font-size="17" fill="#93b3c8">Processes, users, data, integrations, outcomes</text>
    <rect x="492" y="358" width="216" height="12" rx="6" fill="#11324d"/>
    <rect x="492" y="358" width="146" height="12" rx="6" fill="#2bacf5"/>
  </g>

  <g stroke="#52bbf8" stroke-width="3" stroke-opacity="0.42" fill="none">
    <path d="M405 276H318"/>
    <path d="M795 276H882"/>
    <path d="M482 406l-84 78"/>
    <path d="M718 406l84 78"/>
  </g>

  <g filter="url(#shadow2)" font-family="Arial,Helvetica,sans-serif">
    <g>
      <rect x="82" y="204" width="236" height="144" rx="25" fill="#0a1f32" stroke="#2b90c9"/>
      <rect x="112" y="235" width="92" height="65" rx="8" fill="#103a60" stroke="#51c1ff"/>
      <path d="M126 255h64M126 272h44" stroke="#86d4ff" stroke-width="4" stroke-linecap="round"/>
      <text x="222" y="251" font-size="22" font-weight="700" fill="#fff">Web</text>
      <text x="222" y="281" font-size="15" fill="#8bacc1">Apps &amp; APIs</text>
    </g>
    <g>
      <rect x="882" y="204" width="236" height="144" rx="25" fill="#0a1f32" stroke="#2b90c9"/>
      <rect x="912" y="230" width="48" height="84" rx="11" fill="#103a60" stroke="#51c1ff"/>
      <circle cx="936" cy="299" r="3.5" fill="#86d4ff"/>
      <text x="982" y="251" font-size="22" font-weight="700" fill="#fff">Mobile</text>
      <text x="982" y="281" font-size="15" fill="#8bacc1">Android &amp; iOS</text>
    </g>
    <g>
      <rect x="212" y="452" width="276" height="128" rx="25" fill="#0a1f32" stroke="#2b90c9"/>
      <circle cx="254" cy="496" r="22" fill="#103a60" stroke="#51c1ff"/>
      <path d="M242 497h24M254 485v24" stroke="#86d4ff" stroke-width="4" stroke-linecap="round"/>
      <text x="294" y="490" font-size="22" font-weight="700" fill="#fff">Enterprise</text>
      <text x="294" y="520" font-size="15" fill="#8bacc1">Systems &amp; integrations</text>
    </g>
    <g>
