      <rect x="746" y="480" width="70" height="48" rx="7" fill="#103a60" stroke="#51c1ff"/>
      <path d="M781 528v12M760 540h42" stroke="#86d4ff" stroke-width="4" stroke-linecap="round"/>
      <text x="842" y="490" font-size="22" font-weight="700" fill="#fff">Windows</text>
      <text x="842" y="520" font-size="15" fill="#8bacc1">Desktop software</text>
    </g>
